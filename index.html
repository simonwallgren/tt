<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Taqwa Track</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taqwa Track">
<meta name="theme-color" content="#F3F6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<style>
body{margin:0}

/* Layout: one narrow column, one home view. Everything else opens from quiet links at the bottom; one small fixed button bottom right. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#14201D; --muted:#5C6A66; --line:#DBE3E0;
  --alert:#C0392B; --accent:#1E6E62; --accent-ink:#FFFFFF; --accent-soft:#DCEEE9; --warn:#8F5512; --warn-soft:#F6E6CF;
  --display:system-ui,-apple-system,"Segoe UI",sans-serif; --body:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --ink:#E5ECEA; --muted:#93A19C; --line:#27322E;
  --alert:#D9483A; --accent:#5FBFAD; --accent-ink:#0E1412; --accent-soft:#17322D; --warn:#E2A85C; --warn-soft:#3A2B15; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --ink:#E5ECEA; --muted:#93A19C; --line:#27322E;
  --alert:#D9483A; --accent:#5FBFAD; --accent-ink:#0E1412; --accent-soft:#17322D; --warn:#E2A85C; --warn-soft:#3A2B15; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:560px;margin:0 auto;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em}
.status{font-size:13px;color:var(--muted);text-align:right;min-width:0}
#view{display:flex;flex-direction:column;gap:20px;min-width:0}
h2{font-family:var(--display);font-size:20px;line-height:1.25;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.block{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer .btn{font-family:var(--display);font-size:18px;min-height:56px}
.answer .btn[aria-pressed="true"].yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.answer .btn[aria-pressed="true"].no{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
.group{padding-top:6px}
input[type=text],input[type=datetime-local],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:44px;text-align:left}
input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;margin:0}
textarea{min-height:96px;resize:vertical}
.pwrow{display:flex;gap:8px;align-items:stretch}.pwrow input{flex:1;min-width:0}.showbtn{flex:none;padding:0 14px;border-radius:12px;border:1px solid var(--line,#2a3330);background:transparent;color:inherit;font:inherit;font-size:14px;cursor:pointer}
label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;min-height:36px;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.entry:first-child{border-top:0;padding-top:0}
.entry p{font-size:15px;overflow-wrap:anywhere}
.entry b{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:transparent;padding:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.cell.off{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.bar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.figs{display:flex;flex-wrap:wrap;gap:10px 28px}
.fig b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.fig span{font-size:13px;color:var(--muted)}
.nav{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;gap:2px;overflow-x:auto;margin:-8px 0;padding:6px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:8px;min-height:44px;border-radius:8px;white-space:nowrap;flex:0 0 auto}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.link{border:0;background:transparent;color:var(--muted);padding:10px 12px;font-size:14px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.link.back{align-self:flex-start;padding-left:0;text-decoration:none}
.quote{font-size:17px;line-height:1.55;text-wrap:pretty}
.ref{font-size:13px;color:var(--muted)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.fab[hidden]{display:none}
.fab{background:var(--alert);border-color:var(--alert);color:#fff}
@keyframes pulse{0%{box-shadow:0 1px 4px rgba(0,0,0,.14),0 0 0 0 color-mix(in srgb,var(--alert) 40%,transparent)}70%,100%{box-shadow:0 1px 4px rgba(0,0,0,.14),0 0 0 10px color-mix(in srgb,var(--alert) 0%,transparent)}}
@media (prefers-reduced-motion:no-preference){ .fab{animation:pulse 2.8s ease-out infinite} }
.meter{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:calc(76px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:48px;max-width:468px;border-radius:24px;border:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 16px;font-size:13px;color:var(--muted);z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.meter[hidden]{display:none}
.meter .track{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter .fill{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.dcard{touch-action:pan-y;gap:12px;overflow:hidden;box-sizing:border-box}
.dcard .tap{width:104px;height:104px;font-size:22px;flex:0 0 auto}
.dscroll{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.app.focus{padding-block:8px 80px;gap:12px}
.app.focus .top{display:none}
.app.focus #view{gap:8px}
.fix{border-left:2px solid var(--accent);padding-left:10px;display:flex;flex-direction:column;gap:2px}
.fix p{white-space:pre-wrap;font-size:14px}
.dcard.must{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 26px color-mix(in srgb,var(--accent) 38%,transparent)}
.dcard.done{background:var(--accent-soft)}
.arabic{font-family:"Geeza Pro","Al Nile","Noto Naskh Arabic","Amiri",serif;font-size:24px;line-height:2;direction:rtl;text-align:right;overflow-wrap:anywhere}
.tap{width:132px;height:132px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--ink);font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap.big{width:176px;height:176px;font-size:40px}
.tap small{font-family:var(--body);font-size:12px;color:var(--muted)}
.tap.full{background:var(--accent);color:var(--accent-ink)}
.tap.full small{color:var(--accent-ink)}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav strong{font-weight:600}
@media (prefers-reduced-motion:no-preference){ .fill{transition:width .3s} }

html{-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
.top h1,h2{font-weight:650}
.app[hidden]{display:none}
.gate{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:max(32px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.gate[hidden]{display:none}
.gatebox{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;margin-top:6vh}
.gatebox h1{font-family:var(--display);font-size:24px;font-weight:650;margin:0 0 4px}
input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1>Taqwa Track</h1><span class="status" id="status" role="status"></span></header>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main id="view"></main>
</div>
<button class="meter" id="meter" type="button" aria-label="Protection today. Open dhikr." hidden><span>Protection</span><span class="track"><span class="fill" id="meter-fill" style="width:0%"></span></span><b id="meter-pct">0%</b></button>
<button class="fab" id="fab" type="button" aria-label="Steps for right now"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/></svg></button>
<div class="gate" id="gate"></div>
<script src="adhkar.js"></script>
<script src="app.js"></script>
</body>
</html>
